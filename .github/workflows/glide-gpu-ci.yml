name: Glide GPU CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gpu-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libx11-dev
      - name: Build and test graphics stack
        run: |
          cargo test --all-features --manifest-path glide-gfx/Cargo.toml
          cargo test --workspace --all-targets
          cargo build --release --manifest-path glide-gl-bridge/Cargo.toml
          test -f target/release/libglide_gl_bridge.so
          cargo run --release --features vulkan --manifest-path glide-gfx/Cargo.toml --bin gfx_probe || true
          echo "GLIDE_GPU_CI=passed"
